interface:
  display_name: "葡语疾病配图（医学插画板）"
  short_description: "为疾病词条生成统一风格的 AI 医学插画板配图（纯文生图，不传参考图）：中灰底 + 左侧出血剖面主图（3 条白点引线解剖标注）+ 右上 1 张放大写实照片 + 右下 4 个白底圆盘彩色卡通症状图标 + 底部加粗小结；用 ImageGen 出 4:3 图，sharp 去水印转 webp，成对登记双语 alt 并跑通 check-i18n 门禁"
  default_prompt: "使用 $disease-image-generation-ptbr 为指定疾病（或一批疾病）生成/重做医学插画板配图。先确认该疾病在 src/data/diseases.ts 中非 draft，并判定 images.ts 里现有 alt 是否已是 Ilustração médica 插画板风格；从该病 summary 与症状 bullets 提取素材，按六格定内容：左侧剖面主图与病理视觉点、3 条解剖标注（并写明每个白点落在哪个结构上）、右上 1 张写实照片（从临床照片、患者场景、影像片、检验单、器械、量表里挑最能说明问题的那一张，放大铺满右列上半，不要放第二张）、4 个症状图标（写清圆盘里画什么动作与物件，标签葡语 ≤12 字符）、底部一行小结（≤34 字符）。套用编号契约式英文模板（clean modern medical infographic illustration，禁 watercolor / hand-painted / 3D 渲染 / 线稿图标，纯文生图，不传任何参考图）用 ImageGen 生成 4:3 图（1536x1152，quality high），用 sharp 去除「AI 生成」水印（落在灰底就填灰，压住文字才用 SVG 重画该条）并缩到 1024x768 转码 webp（quality 82，命名 doenca-<slug>.webp）；逐张 Read 核图，确认六格齐全、画法没退回水彩或 3D 写实、9 条葡语文字拼写与变音正确、白点指向正确、无中文字符、无水印、观感不惊悚；再成对写 images.ts（pt-BR）与 zh-Hant/image-alts.ts（繁中）的 alt（只描述画面、无破折号、繁中无简体字无「你」）；最后跑 node scripts/check-i18n.mjs 必须全绿。构建与部署由用户执行，本 skill 不跑 build/deploy，也不动 diseases.ts 正文与文章配图。"
