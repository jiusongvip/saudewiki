interface:
  display_name: "葡语疾病医典"
  short_description: "脚本索引+百度搜索兜底定位疾病医典，重写成巴西葡语内容并连同繁体孪生与 5 篇派生文章写入本站数据文件"
  default_prompt: "使用 $disease-encyclopedia-ptbr 定位指定疾病的医典链接（先跑脚本查疾病目录索引，未命中再用浏览器百度搜索兜底；已提供链接则直接读取），先判定是新增疾病还是修改已有疾病，核实医学事实后重写为巴西葡语与繁体中文两个语言层，并连同 5 篇派生文章直接写入 src/data 数据文件，同时完成主题、分类与图片接线。"
